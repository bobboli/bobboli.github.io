# Hexo Configuration
# Docs: https://hexo.io/docs/configuration.html

# Site
title: Bo Li
subtitle: "Engineering notes on AI infrastructure, GPU computing, and systems"
description: "Bo Li's personal website and engineering notebook."
keywords:
  - AI infrastructure
  - GPU computing
  - systems
  - engineering
author: Bo Li
language: en
timezone: Asia/Shanghai

# URL
url: https://bobboli.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Home page setting
index_generator:
  path: tech-blogs
  per_page: 10
  order_by: -date

# Category & Tag
default_category: engineering
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: icarus

# Feed and sitemap
feed:
  type: atom
  path: atom.xml
  limit: 20
sitemap:
  path: sitemap.xml

# Deployment is handled by GitHub Actions.
deploy:
  type: ''
